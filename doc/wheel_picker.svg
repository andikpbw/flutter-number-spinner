<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="wheelGloss" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="pointerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="spinBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="dropSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="resClip">
      <rect x="245" y="74" width="130" height="34" rx="8"/>
    </clipPath>
  </defs>

  <rect width="420" height="200" rx="18" fill="url(#bgW)" stroke="#334155" stroke-width="1.5"/>
  <text x="24" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">3D Spin Wheel Picker (SpinWheelNumberSpinner)</text>

  <!-- =================================================================== -->
  <!-- 3D CIRCULAR SPIN WHEEL (10 COLORFUL SLICES 1..10)                   -->
  <!-- =================================================================== -->
  <g transform="translate(122, 114)">
    <!-- Outer White/Metallic Bezel Ring -->
    <circle cx="0" cy="0" r="74" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#dropSh)"/>
    <circle cx="0" cy="0" r="69.5" fill="none" stroke="#F59E0B" stroke-width="2.5"/>

    <!-- Rotating 10-Slice Wheel Group -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0; 0; 612; 612; 1224; 1224; 1800"
        keyTimes="0; 0.08; 0.38; 0.52; 0.82; 0.94; 1"
        calcMode="spline"
        keySplines="0 0 1 1; 0.12 0.85 0.22 1; 0 0 1 1; 0.12 0.85 0.22 1; 0 0 1 1; 0.12 0.85 0.22 1"
        dur="6s" repeatCount="indefinite"/>

      <!-- Slice 1 (Red) -->
      <g transform="rotate(0)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
      </g>
      <!-- Slice 2 (Amber/Yellow) -->
      <g transform="rotate(36)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
      </g>
      <!-- Slice 3 (Green) -->
      <g transform="rotate(72)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
      </g>
      <!-- Slice 4 (Sky Blue) -->
      <g transform="rotate(108)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
      </g>
      <!-- Slice 5 (Purple) -->
      <g transform="rotate(144)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#A855F7" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">5</text>
      </g>
      <!-- Slice 6 (Coral Red) -->
      <g transform="rotate(180)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">6</text>
      </g>
      <!-- Slice 7 (Gold) -->
      <g transform="rotate(216)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#EAB308" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">7</text>
      </g>
      <!-- Slice 8 (Emerald) -->
      <g transform="rotate(252)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">8</text>
      </g>
      <!-- Slice 9 (Blue) -->
      <g transform="rotate(288)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">9</text>
      </g>
      <!-- Slice 10 (Magenta/Violet) -->
      <g transform="rotate(324)">
        <path d="M 0,0 L -21.01,-64.67 A 68,68 0 0,1 21.01,-64.67 Z" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.2"/>
        <text x="0" y="-44" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">10</text>
      </g>

      <!-- Perimeter Rim Pegs -->
      <circle cx="-21.01" cy="-64.67" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <circle cx="21.01" cy="-64.67" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <circle cx="55.01" cy="-39.97" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <circle cx="68.0" cy="0" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <circle cx="55.01" cy="39.97" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <circle cx="21.01" cy="64.67" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <circle cx="-21.01" cy="64.67" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <circle cx="-55.01" cy="39.97" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <circle cx="-68.0" cy="0" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
      <circle cx="-55.01" cy="-39.97" r="2.6" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    </g>

    <!-- 3D Glossy Highlight Overlay -->
    <circle cx="0" cy="0" r="68" fill="url(#wheelGloss)" pointer-events="none"/>

    <!-- Center 3D Teardrop Pointer & Hub (pointing to 12 o'clock winner) -->
    <path d="M 0,-29 Q 12,-8 13,0 A 13,13 0 1,1 -13,0 Q -12,-8 0,-29 Z" fill="url(#pointerGrad)" stroke="#FFFFFF" stroke-width="2" filter="url(#dropSh)"/>
    <circle cx="0" cy="2" r="6.5" fill="#FFFFFF"/>
  </g>

  <!-- =================================================================== -->
  <!-- RIGHT SIDE: RESULT CARD & [-] [SPIN] [+] CONTROLS                   -->
  <!-- =================================================================== -->
  <rect x="230" y="48" width="160" height="72" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="310" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">WINNING RESULT</text>

  <g clip-path="url(#resClip)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,0; 0,-34; 0,-34; 0,-68; 0,-68; 0,0"
        keyTimes="0; 0.34; 0.40; 0.78; 0.84; 0.96; 1"
        dur="6s" repeatCount="indefinite"/>
      <text x="310" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#22C55E" text-anchor="middle">1</text>
      <text x="310" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0EA5E9" text-anchor="middle">4</text>
      <text x="310" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#EAB308" text-anchor="middle">7</text>
    </g>
  </g>

  <!-- Bottom Control Bar: [-] [SPIN] [+] -->
  <!-- [-] Button -->
  <circle cx="256" cy="154" r="18" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <rect x="250" y="152.8" width="12" height="2.4" rx="1.2" fill="#38BDF8"/>

  <!-- [SPIN] Green Button -->
  <circle cx="310" cy="154" r="23" fill="url(#spinBtnGrad)" stroke="#FFFFFF" stroke-width="2.2" filter="url(#dropSh)"/>
  <path d="M 310,144 A 10,10 0 1,1 301,150" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="298,144 305,144 301,151" fill="#FFFFFF"/>

  <!-- [+] Button -->
  <circle cx="364" cy="154" r="18" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <rect x="358" y="152.8" width="12" height="2.4" rx="1.2" fill="#38BDF8"/>
  <rect x="362.8" y="148" width="2.4" height="12" rx="1.2" fill="#38BDF8"/>
</svg>
